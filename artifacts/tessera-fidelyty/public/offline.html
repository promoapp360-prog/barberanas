<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101115">
  <meta name="robots" content="noindex">
  <title>Da Barber Anas · Connessione assente</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:#0c0d10; color:#f7f6f3; font:16px/1.55 system-ui,sans-serif; }
    main { max-width:420px; padding:clamp(22px,6vw,36px); background:#181a1e; border:1px solid #645133; border-radius:18px; box-shadow:0 16px 36px #0007; }
    .brand { color:#f0ce82; font-weight:700; font-size:13px; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:10px 0; line-height:1.15; }
    button { min-height:44px; margin-top:6px; padding:10px 20px; border:0; border-radius:10px; background:#f0ce82; color:#20180b; font:inherit; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Da Barber Anas</div>
    <h1>Non sei connesso</h1>
    <p>Ricollegati a Internet per vedere la tua tessera e i timbri aggiornati.</p>
    <button onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
